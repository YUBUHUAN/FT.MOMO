name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Provide bundled node.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-native/node | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node desktop-native/node/node.exe -Force
          dotnet --list-runtimes

      - name: Build portable app
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-native.ps1

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-installer.ps1

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MomoPet-Windows-Portable/*" -DestinationPath "MomoPet-Windows-Portable-v1.4.2.1.zip" -CompressionLevel Optimal
          Get-Item "MomoPet-Windows-Portable-v1.4.2.1.zip", "dist/MomoPet-Setup-1.4.2.1.exe" | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            MomoPet-Windows-Portable-v1.4.2.1.zip
            dist/MomoPet-Setup-1.4.2.1.exe
          retention-days: 7

  release:
    needs: windows-portable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: List assets
        run: find release-assets -type f -printf '%p %s\n' | sort

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.4.2.1 --yes 2>/dev/null || true
          gh release create v1.4.2.1 android/release/MomoPet-Android-1.4.2.1.apk \
            --title "墨墨桌宠 v1.4.2.1" \
            --notes "1.4.2.1：新增睡觉系统（熄灯、闭眼、快速恢复疲惫）；修复手机端出游对话泡被遮挡；小蛋糕新增冰淇淋口味；沿用 1.4.1 的主食、辣条和黑暗料理分组。Windows 安装版、便携版、独立 Android APK，登录同一个账号即可同步。" \
            --verify-tag --draft

      - name: Upload Windows setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETUP=$(find release-assets -name 'MomoPet-Setup-1.4.2.1.exe' -print -quit)
          echo "setup=$SETUP"
          gh release upload v1.4.2.1 "$SETUP" --clobber

      - name: Upload portable zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(find release-assets -name 'MomoPet-Windows-Portable-v1.4.2.1.zip' -print -quit)
          echo "zip=$ZIP"
          gh release upload v1.4.2.1 "$ZIP" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.4.2.1 --draft=false
