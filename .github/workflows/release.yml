name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Provide bundled node.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-native/node | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node desktop-native/node/node.exe -Force
          dotnet --list-runtimes

      - name: Build portable app
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-native.ps1

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-installer.ps1

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MomoPet-Windows-Portable/*" -DestinationPath "MomoPet-Windows-Portable-v1.2.0.zip" -CompressionLevel Optimal
          Get-Item "MomoPet-Windows-Portable-v1.2.0.zip", "dist/MomoPet-Setup-1.2.0.exe" | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            MomoPet-Windows-Portable-v1.2.0.zip
            dist/MomoPet-Setup-1.2.0.exe
          retention-days: 7

  release:
    needs: windows-portable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: List assets
        run: ls -lh release-assets android/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 \
            release-assets/MomoPet-Windows-Portable-v1.2.0.zip \
            release-assets/MomoPet-Setup-1.2.0.exe \
            android/release/MomoPet-Android-1.2.0.apk \
            --title "墨墨桌宠 v1.2.0" \
            --notes "Windows 安装版、Windows 便携版、Android APK。首次打开先创建或登录账号；Android 安装后填写电脑上「个人页面 → 账号与同步」里的地址。" \
            --verify-tag
